<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="theme-color" content="#05070d" />
<meta name="description" content="야간구장 홈런 쇼다운 — 혼자서 AI 투수와 홈런 더비, 한 폰으로 아빠와 아이가 즐기는 2인 투타 승부 야구 게임" />
<title>야간구장 홈런 쇼다운 ⚾ | 1인·2인 야구 게임</title>
<style>
  :root{
    --ink:#05070d;
    --panel:#0b121d;
    --line:rgba(110,170,255,.22);
    --neon:#7dfba1;
    --amber:#ffcc66;
    --blue:#5fd0ff;
    --pink:#ff6b9d;
    --txt:#e9f2ff;
    --dim:#8ea6c8;
    --teamA:#5fd0ff;
    --teamB:#ff6b9d;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{
    margin:0;padding:0;height:100%;overflow:hidden;background:var(--ink);color:var(--txt);
    font-family:"Apple SD Gothic Neo","Pretendard","Malgun Gothic","Noto Sans KR",system-ui,-apple-system,sans-serif;
    touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;overscroll-behavior:none;
  }
  #app{position:fixed;inset:0;display:flex;flex-direction:column}

  /* ---------------- 전광판 ---------------- */
  #board{
    flex:0 0 auto;position:relative;z-index:6;
    padding:5px 8px 4px;
    background:linear-gradient(180deg,#0a1420 0%,#060b13 100%);
    border-bottom:1px solid #16233a;
    font-variant-numeric:tabular-nums;
    box-shadow:0 2px 10px rgba(0,0,0,.5);
  }
  .brow{display:flex;align-items:center;gap:8px}
  .teams{display:flex;align-items:center;gap:9px;flex:1;min-width:0}
  .team{display:flex;align-items:center;gap:4px;font-size:12px;color:#b9cbe4;white-space:nowrap}
  .team b{font:800 15px/1 ui-monospace,SFMono-Regular,Menlo,monospace;color:#fff;text-shadow:0 0 8px rgba(140,200,255,.45)}
  .tdot{width:7px;height:7px;border-radius:50%;flex:0 0 auto}
  .tdot.ta{background:var(--teamA);box-shadow:0 0 6px var(--teamA)}
  .tdot.tb{background:var(--teamB);box-shadow:0 0 6px var(--teamB)}
  .binfo{display:flex;align-items:center;gap:4px;font-size:11px;color:var(--amber);font-weight:700;white-space:nowrap}
  .icobtn{
    width:26px;height:26px;border-radius:8px;border:1px solid rgba(110,170,255,.26);
    background:rgba(12,22,38,.85);color:#a9c6ea;font-size:12px;line-height:1;
    display:flex;align-items:center;justify-content:center;padding:0;cursor:pointer;flex:0 0 auto;
  }
  .icobtn:active{background:#152740}
  .brow2{display:flex;align-items:center;gap:9px;margin-top:3px}
  .bc{display:flex;align-items:center;gap:3px}
  .bc em{font:700 9px/1 ui-monospace,monospace;color:#4f6a8b;font-style:normal}
  .dots{display:flex;gap:2.5px}
  .dots i{display:block;width:6px;height:6px;border-radius:50%;background:#16243a;transition:background .12s,box-shadow .12s}
  .dots i.on{background:var(--neon);box-shadow:0 0 7px var(--neon)}
  .dots i.on.amber{background:var(--amber);box-shadow:0 0 7px var(--amber)}
  .dots i.on.pink{background:var(--pink);box-shadow:0 0 7px var(--pink)}
  #situ{flex:1;text-align:right;font-size:10px;color:#8fa8c6;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

  /* ---------------- 경기장 ---------------- */
  #stage{position:relative;flex:1 1 auto;min-height:0;overflow:hidden;touch-action:none}
  #cv{display:block;width:100%;height:100%}
  #bigText{
    position:absolute;left:0;right:0;top:26%;text-align:center;pointer-events:none;
    opacity:0;transition:opacity .16s;z-index:4;
  }
  #bigText.show{opacity:1;animation:pop .34s cubic-bezier(.2,1.6,.4,1)}
  #bigText b{
    display:block;font-size:clamp(22px,7.6vw,40px);letter-spacing:-.01em;font-weight:900;
    color:#fff;text-shadow:0 0 18px rgba(255,220,120,.75),0 3px 0 rgba(0,0,0,.6);
  }
  #bigText span{display:block;margin-top:2px;font-size:clamp(11px,3.4vw,15px);color:#ffe9b0;font-weight:700;text-shadow:0 2px 6px rgba(0,0,0,.8)}
  @keyframes pop{0%{transform:scale(.7);opacity:0}60%{transform:scale(1.06)}100%{transform:scale(1)}}
  #aiLog{
    position:absolute;right:6px;top:6px;width:44%;max-width:190px;display:flex;flex-direction:column;
    gap:2px;align-items:flex-end;pointer-events:none;z-index:3;
  }
  #aiLog span{
    font-size:10px;padding:2px 7px;border-radius:999px;
    background:rgba(6,12,22,.72);border:1px solid rgba(110,170,255,.18);color:#b9cfe8;
    animation:pop .2s ease-out;
  }

  /* ---------------- 조작 패널 ---------------- */
  #panel{flex:0 0 auto;touch-action:none;padding:7px 8px calc(7px + env(safe-area-inset-bottom));background:linear-gradient(180deg,#070c14,#04070d);border-top:1px solid #142033;display:flex;flex-direction:column;gap:6px;z-index:6}
  .hidden{display:none !important}

  #pitchPanel{display:flex;flex-direction:column;gap:6px}
  .prow{display:flex;align-items:center;gap:6px}
  .pwho{font-size:10px;color:#8fa8c6;white-space:nowrap;width:52px;flex:0 0 auto;line-height:1.15}
  .chips{display:flex;gap:5px;flex:1;min-width:0}
  .chip{
    flex:1 1 0;min-width:0;padding:7px 2px;border-radius:10px;
    border:1px solid rgba(110,170,255,.24);background:rgba(13,24,40,.9);color:#a9c6ea;
    font-size:11.5px;font-weight:700;line-height:1.1;cursor:pointer;white-space:nowrap;
    transition:background .1s,color .1s,box-shadow .1s,transform .06s;
  }
  .chip:active{transform:scale(.96)}
  .chip.on{background:linear-gradient(180deg,#173858,#0f2438);color:#eaf6ff;border-color:rgba(120,200,255,.65);box-shadow:0 0 10px rgba(95,208,255,.28) inset}
  #pitchPanel.locked .chip{opacity:.45}
  #pitchPanel.locked #btnThrow{opacity:.45}
  .throwBtn{
    flex:0 0 auto;width:62px;padding:9px 0;border-radius:11px;border:1px solid rgba(125,251,161,.5);
    background:linear-gradient(180deg,#1d6b45,#0e3c28);color:#dcffe8;font-weight:900;font-size:12.5px;cursor:pointer;
    box-shadow:0 0 14px rgba(125,251,161,.18);
  }
  .throwBtn:active{transform:scale(.96)}

  #batPanel{display:flex;flex-direction:column;gap:5px}
  .swingBtn{
    width:100%;height:clamp(66px,11.5vh,112px);border-radius:16px;border:1px solid rgba(255,190,90,.55);
    background:radial-gradient(120% 160% at 50% 0%,#ffcf7a 0%,#ff9d3d 42%,#c9631a 100%);
    color:#2b1200;font-weight:900;font-size:clamp(20px,6vw,27px);letter-spacing:.02em;
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
    cursor:pointer;box-shadow:0 6px 18px rgba(255,140,40,.28),0 0 0 1px rgba(0,0,0,.3) inset;
    transition:transform .05s,filter .1s;
  }
  .swingBtn:active{transform:scale(.975);filter:brightness(1.12)}
  .swingBtn .swingSub{font-size:11px;font-weight:700;color:rgba(60,26,0,.72);letter-spacing:0}
  .swingBtn.disabled{filter:grayscale(.65) brightness(.62);pointer-events:none}
  .batMeta{display:flex;justify-content:space-between;font-size:10px;color:#6f89a8;padding:0 3px}
  #app.p2 .swingBtn{height:clamp(58px,9vh,86px)}
  #app.derby .swingBtn{background:radial-gradient(120% 160% at 50% 0%,#a8f5ff 0%,#5fd0ff 45%,#1f6f9d 100%);color:#04202e;box-shadow:0 6px 18px rgba(95,208,255,.3)}

  /* ---------------- 화면(오버레이) ---------------- */
  .screen{
    position:fixed;inset:0;z-index:20;display:flex;flex-direction:column;justify-content:center;
    gap:10px;padding:18px 16px calc(18px + env(safe-area-inset-bottom));
    background:radial-gradient(120% 90% at 50% 0%,rgba(9,20,38,.82),rgba(3,6,12,.94) 70%);
    -webkit-backdrop-filter:blur(5px);backdrop-filter:blur(5px);overflow-y:auto;touch-action:pan-y;-webkit-overflow-scrolling:touch; overscroll-behavior:contain;
  }
  .scrInner{width:100%;max-width:430px;margin:0 auto;display:flex;flex-direction:column;gap:10px}
  .kicker{font-size:11px;letter-spacing:.22em;color:#5f86b6;font-weight:800;text-align:center}
  h1{margin:0;text-align:center;font-size:clamp(26px,7.6vw,34px);line-height:1.12;font-weight:900;letter-spacing:-.02em}
  h1 em{font-style:normal;color:var(--amber);text-shadow:0 0 20px rgba(255,190,80,.5)}
  .sub{margin:0;text-align:center;font-size:12.5px;line-height:1.55;color:#9fb6d2}
  .bigBtn{
    width:100%;padding:14px 12px;border-radius:14px;border:1px solid rgba(110,170,255,.28);
    background:linear-gradient(180deg,rgba(22,42,70,.95),rgba(11,21,35,.95));color:#eaf6ff;
    font-size:15px;font-weight:800;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:3px;
    transition:transform .07s,border-color .1s;
  }
  .bigBtn:active{transform:scale(.985);border-color:rgba(120,200,255,.6)}
  .bigBtn small{font-size:11px;font-weight:600;color:#8fa8c6;line-height:1.4}
  .bigBtn .ico{font-size:16px;margin-right:5px}
  .bigBtn.primary{background:linear-gradient(180deg,#1d5f8e,#123a5c);border-color:rgba(120,200,255,.6);box-shadow:0 0 22px rgba(95,208,255,.2)}
  .recordBox{
    display:flex;justify-content:space-between;gap:8px;padding:10px 12px;border-radius:12px;
    background:rgba(10,20,34,.8);border:1px solid rgba(110,170,255,.16);font-size:11.5px;color:#9fb6d2;
  }
  .recordBox b{color:var(--amber);font-weight:800}
  .rowBtns{display:flex;gap:8px}
  .rowBtns .bigBtn{text-align:center;align-items:center;justify-content:center}
  .foot{font-size:10.5px;color:#5f7691;text-align:center;line-height:1.6}
  #resStats{display:flex;flex-direction:column;gap:6px;padding:12px;border-radius:12px;background:rgba(10,20,34,.8);border:1px solid rgba(110,170,255,.16)}
  .resRow{display:flex;justify-content:space-between;font-size:12.5px;color:#b9cfe8}
  .resRow b{color:#fff;font-weight:800;font-variant-numeric:tabular-nums}
  #resTitle{font-size:clamp(24px,7.4vw,32px);font-weight:900;text-align:center;margin:0;letter-spacing:-.01em}
  #resSub{text-align:center;font-size:12.5px;color:#9fb6d2;margin:0}
  .newRec{color:var(--neon) !important;text-shadow:0 0 12px rgba(125,251,161,.6)}
</style>
</head>
<body>
<div id="app">
  <!-- 전광판 -->
  <div id="board">
    <div class="brow">
      <div class="teams">
        <span class="team"><i class="tdot ta"></i><span id="tnA">청팀</span><b id="sA">0</b></span>
        <span class="team"><i class="tdot tb"></i><span id="tnB">홍팀</span><b id="sB">0</b></span>
      </div>
      <div class="binfo"><span id="bHalf">▲</span><span id="bInn">1회</span></div>
      <button id="btnMute" class="icobtn" aria-label="소리 켜기/끄기">🔊</button>
      <button id="btnHome" class="icobtn" aria-label="처음으로">◀</button>
    </div>
    <div class="brow2">
      <span class="bc"><em>B</em><span class="dots" id="dB"></span></span>
      <span class="bc"><em>S</em><span class="dots" id="dS"></span></span>
      <span class="bc"><em>O</em><span class="dots" id="dO"></span></span>
      <span id="situ">플레이 볼!</span>
    </div>
  </div>

  <!-- 경기장 -->
  <div id="stage">
    <canvas id="cv"></canvas>
    <div id="bigText"><b></b><span></span></div>
    <div id="aiLog"></div>
  </div>

  <!-- 조작 -->
  <div id="panel">
    <div id="pitchPanel" class="hidden">
      <div class="prow">
        <span class="pwho" id="pWho">투수</span>
        <span class="chips" id="typeChips">
          <button class="chip on" data-type="fast">직구</button>
          <button class="chip" data-type="curve">커브</button>
          <button class="chip" data-type="change">체인지업</button>
        </span>
      </div>
      <div class="prow">
        <span class="pwho">코스</span>
        <span class="chips" id="courseChips">
          <button class="chip" data-course="in">안쪽</button>
          <button class="chip on" data-course="mid">가운데</button>
          <button class="chip" data-course="out">바깥쪽</button>
        </span>
        <button id="btnThrow" class="throwBtn">투구!</button>
      </div>
    </div>
    <div id="batPanel">
      <button id="btnSwing" class="swingBtn"><span>스윙!</span><span class="swingSub" id="swingSub">공이 오면 타이밍에 맞춰 터치</span></button>
      <div class="batMeta"><span id="metaL">타자</span><span id="metaR"></span></div>
    </div>
  </div>

  <!-- 타이틀 -->
  <div id="scrTitle" class="screen">
    <div class="scrInner">
      <div class="kicker">NIGHT GAME · BASEBALL</div>
      <h1>야간구장<br><em>홈런 쇼다운</em> ⚾</h1>
      <p class="sub">AI 투수와의 홈런 더비부터<br>한 폰으로 즐기는 아빠·아이 2인 투타 대전까지</p>
      <button class="bigBtn primary" id="btnSolo"><span><span class="ico">⚾</span>1인 도전</span><small>AI 투수와 홈런 더비 10구 / 3이닝 미니 경기</small></button>
      <button class="bigBtn" id="btnDuo"><span><span class="ico">👨‍👦</span>2인 대전</span><small>한 폰으로 투수·타자 번갈아, 1이닝 / 3이닝 승부</small></button>
      <div class="recordBox"><span>최고 기록</span><span id="titleBest">홈런 <b>0</b>개 · 최장 <b>0</b>m</span></div>
      <div class="foot">위쪽 전광판의 🔊 버튼으로 소리를 끄고 켤 수 있어요.<br>첫 터치에서 사운드가 켜집니다.</div>
    </div>
  </div>

  <!-- 모드 선택 -->
  <div id="scrSetup" class="screen hidden">
    <div class="scrInner">
      <div class="kicker" id="setupKicker">MODE SELECT</div>
      <h1 id="setupTitle">1인 모드</h1>
      <div id="setupCards"></div>
      <button class="bigBtn" id="btnBackSetup"><span>← 돌아가기</span></button>
    </div>
  </div>

  <!-- 결과 -->
  <div id="scrResult" class="screen hidden">
    <div class="scrInner">
      <div class="kicker" id="resKicker">GAME SET</div>
      <h1 id="resTitle">경기 종료</h1>
      <p id="resSub"></p>
      <div id="resStats"></div>
      <div class="rowBtns">
        <button class="bigBtn primary" id="btnAgain" style="flex:1"><span>한 번 더</span></button>
        <button class="bigBtn" id="btnToTitle" style="flex:1"><span>모드 선택</span></button>
      </div>
    </div>
  </div>
</div>

<script>
(function(){
'use strict';

/* ============================================================
   0. 오류 수집 (검증용)
   ============================================================ */
window.__errs = [];
window.addEventListener('error', function(e){
  try{ window.__errs.push(String(e.message)+' @'+String(e.lineno)); }catch(_){}
});
window.addEventListener('unhandledrejection', function(e){
  try{ window.__errs.push('promise:'+String(e.reason)); }catch(_){}
});

/* ============================================================
   1. 유틸
   ============================================================ */
var $ = function(id){ return document.getElementById(id); };
function clamp(v,a,b){ return v<a?a:(v>b?b:v); }
function rnd(a,b){ return a + Math.random()*(b-a); }
function pick(arr){ return arr[Math.floor(Math.random()*arr.length)]; }
function now(){ return performance.now()/1000; }
function sleep(ms){ return new Promise(function(r){ setTimeout(r, ms); }); }
var LS = {
  get:function(k,d){ try{ var v=localStorage.getItem(k); return (v==null)?d:JSON.parse(v); }catch(e){ return d; } },
  set:function(k,v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }
};
function buzz(p){ try{ if(navigator.vibrate) navigator.vibrate(p); }catch(e){} }

/* ============================================================
   2. 사운드 (Web Audio API)
   ============================================================ */
var muted = LS.get('bs_mute', false);
var A = (function(){
  var ctx=null, master=null, nbuf=null;
  function init(){
    if(ctx) return ctx;
    var AC = window.AudioContext || window.webkitAudioContext;
    if(!AC) return null;
    try{
      ctx = new AC();
      master = ctx.createGain();
      master.gain.value = muted ? 0 : 0.85;
      master.connect(ctx.destination);
      var len = Math.floor(ctx.sampleRate*1.2);
      nbuf = ctx.createBuffer(1, len, ctx.sampleRate);
      var d = nbuf.getChannelData(0);
      for(var i=0;i<len;i++) d[i] = Math.random()*2-1;
    }catch(e){ ctx=null; }
    return ctx;
  }
  function resume(){ if(ctx && ctx.state==='suspended'){ try{ ctx.resume(); }catch(e){} } }
  function noise(dur, f0, f1, vol, type, q){
    var c = init(); if(!c) return;
    var src = c.createBufferSource(); src.buffer = nbuf; src.loop = true;
    var flt = c.createBiquadFilter(); flt.type = type||'bandpass'; flt.Q = q||1;
    var t = c.currentTime;
    flt.frequency.setValueAtTime(Math.max(40,f0), t);
    flt.frequency.exponentialRampToValueAtTime(Math.max(40,f1), t+dur);
    var g = c.createGain();
    g.gain.setValueAtTime(0.0001, t);
    g.gain.linearRampToValueAtTime(Math.max(0.0002,vol), t+Math.min(0.03, dur*0.3));
    g.gain.exponentialRampToValueAtTime(0.0001, t+dur);
    src.connect(flt); flt.connect(g); g.connect(master);
    try{ src.start(t); src.stop(t+dur+0.03); }catch(e){}
  }
  function tone(freq, dur, vol, type, glide, when){
    var c = init(); if(!c) return;
    var o = c.createOscillator(); var g = c.createGain();
    o.type = type||'sine';
    var t = c.currentTime + (when||0);
    o.frequency.setValueAtTime(freq, t);
    if(glide) o.frequency.exponentialRampToValueAtTime(Math.max(30,glide), t+dur);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.linearRampToValueAtTime(vol, t+0.012);
    g.gain.exponentialRampToValueAtTime(0.0001, t+dur);
    o.connect(g); g.connect(master);
    try{ o.start(t); o.stop(t+dur+0.03); }catch(e){}
  }
  return {
    init:init, resume:resume,
    setMuted:function(m){
      muted = m;
      init();
      if(master) master.gain.value = m ? 0 : 0.85;
    },
    ui:function(){ tone(680,0.05,0.09,'square',520); },
    whoosh:function(){ noise(0.26, 1100, 240, 0.10, 'bandpass', 0.9); },
    crack:function(q){
      noise(0.085, 2800, 900, 0.16+0.42*q, 'bandpass', 1.3);
      tone(150+60*q, 0.13, 0.16+0.22*q, 'triangle', 70);
    },
    whiff:function(){ noise(0.2, 620, 140, 0.16, 'bandpass', 1.6); },
    strike:function(){ tone(240,0.16,0.22,'square',110); noise(0.13,420,140,0.14,'bandpass',1.2); },
    ball:function(){ tone(320,0.1,0.10,'sine',250); },
    crowd:function(dur, vol){
      noise(dur, 420, 780, vol, 'bandpass', 0.55);
      noise(dur, 1500, 1900, vol*0.45, 'bandpass', 0.8);
    },
    cheer:function(){ noise(0.9,500,1100,0.20,'bandpass',0.6); noise(0.9,1600,2100,0.08,'bandpass',1.1); },
    hr:function(){
      var c = init(); if(!c) return;
      noise(2.6, 380, 900, 0.26, 'bandpass', 0.5);
      noise(2.6, 1500, 2200, 0.10, 'bandpass', 0.9);
      var notes = [523,659,784,1046,1318];
      for(var i=0;i<notes.length;i++) tone(notes[i], 0.24, 0.14, 'triangle', null, i*0.11);
      for(var j=0;j<5;j++) tone(120, 0.18, 0.20, 'sine', 40, 0.5+j*0.42);
    },
    pop:function(when){
      tone(90, 0.2, 0.18, 'sine', 40, when||0);
      noise(0.09, 900, 200, 0.14, 'bandpass', 1.0);
    }
  };
})();

/* ============================================================
   3. 캔버스 & 투영
   ============================================================ */
var cv = $('cv');
var ctx = cv.getContext('2d');
var bg = document.createElement('canvas');
var bx = bg.getContext('2d');
var W = 360, H = 520, dpr = 1;
var CAM = { horiz:0.42, base:0.92, D:38, kx:0.0208, hy:0.055 };

function proj(z){ return CAM.D/(CAM.D+Math.max(0,z)); }
function groundY(z){ var p = proj(z); return H*(CAM.horiz + (CAM.base-CAM.horiz)*p*p); }
function sxy(x,z){ var p = proj(z); return [W*0.5 + x*p*W*CAM.kx, groundY(z)]; }
function sxyz(x,y,z){ var p = proj(z); return [W*0.5 + x*p*W*CAM.kx, groundY(z) - y*p*H*CAM.hy]; }

var ZONE = { cx:0, cy:0, hw:0, hh:0 };
function layoutZone(){ ZONE.cx = W*0.52; ZONE.cy = H*0.785; ZONE.hw = W*0.135; ZONE.hh = H*0.062; }

function resize(){
  var r = cv.parentElement.getBoundingClientRect();
  dpr = Math.min(window.devicePixelRatio||1, 2);
  var nw = Math.max(240, Math.round(r.width));
  var nh = Math.max(200, Math.round(r.height));
  if(bg.width && Math.abs(nw-W)<2 && Math.abs(nh-H)<2) return;
  W = nw; H = nh;
  cv.width = Math.round(W*dpr); cv.height = Math.round(H*dpr);
  ctx.setTransform(dpr,0,0,dpr,0,0);
  bg.width = cv.width; bg.height = cv.height;
  bx.setTransform(dpr,0,0,dpr,0,0);
  layoutZone();
  buildBG();
}

/* ============================================================
   4. 야구장 배경 그리기 (정적 → 오프스크린)
   ============================================================ */
function fenceR(deg){ var a = Math.abs(deg); return 100 - 0.0072*a*a; }
function fencePoint(d){
  var a = d*Math.PI/180, r = fenceR(d);
  return { x:r*Math.sin(a), z:r*Math.cos(a) };
}

function standFrontY(x){
  var t = clamp(x/W, 0, 1);
  return H*(0.52 - 0.12*(2*t*(1-t)));
}

function buildBG(){
  var c = bx;
  c.clearRect(0,0,W,H);

  /* --- 밤하늘 --- */
  var sky = c.createLinearGradient(0,0,0,H*0.5);
  sky.addColorStop(0,'#03050b');
  sky.addColorStop(0.42,'#081227');
  sky.addColorStop(0.78,'#0e2947');
  sky.addColorStop(1,'#173f66');
  c.fillStyle = sky;
  c.fillRect(0,0,W,H*0.5);

  /* 별 */
  for(var i=0;i<110;i++){
    var sx = Math.random()*W, sy = Math.random()*H*0.30;
    var a = 0.10 + Math.random()*0.5;
    c.fillStyle = 'rgba(200,225,255,'+a.toFixed(3)+')';
    c.beginPath(); c.arc(sx, sy, Math.random()<0.14?1.4:0.75, 0, 6.2832); c.fill();
  }

  /* 달 + 달빛 */
  var mx = W*0.84, my = H*0.085;
  var mg = c.createRadialGradient(mx,my,1,mx,my,H*0.13);
  mg.addColorStop(0,'rgba(255,248,225,0.5)');
  mg.addColorStop(0.22,'rgba(210,230,255,0.14)');
  mg.addColorStop(1,'rgba(160,200,255,0)');
  c.fillStyle = mg;
  c.beginPath(); c.arc(mx,my,H*0.13,0,6.2832); c.fill();
  c.fillStyle = 'rgba(255,251,238,0.9)';
  c.beginPath(); c.arc(mx,my,H*0.021,0,6.2832); c.fill();

  /* --- 관중석 --- */
  var top = H*0.13, botY = H*0.56;
  c.beginPath();
  c.moveTo(0, standFrontY(0));
  c.quadraticCurveTo(W*0.5, H*0.435, W, standFrontY(W));
  c.lineTo(W, top);
  c.quadraticCurveTo(W*0.5, H*0.085, 0, top);
  c.closePath();
  var stg = c.createLinearGradient(0,top,0,botY);
  stg.addColorStop(0,'#070d18');
  stg.addColorStop(0.55,'#0a1626');
  stg.addColorStop(1,'#0d1d31');
  c.fillStyle = stg; c.fill();

  /* 관중석 층 구분선 */
  c.strokeStyle = 'rgba(120,170,230,.10)'; c.lineWidth = 1;
  for(var k=1;k<=4;k++){
    var yy = top + (H*0.32)*(k/5);
    c.beginPath();
    c.moveTo(0, yy);
    c.quadraticCurveTo(W*0.5, yy - H*0.028, W, yy);
    c.stroke();
  }
  /* 관중 (작은 점들) */
  var crowdCols = ['#dfe9ff','#9fc4f0','#ffd9a0','#ff9fb8','#a8ffd0','#c6c9ff'];
  for(var n=0;n<620;n++){
    var px = Math.random()*W;
    var fy = standFrontY(px) - H*0.015;
    var ty = Math.max(top+H*0.02, fy - H*0.30);
    var py = ty + Math.random()*(fy-ty);
    var col = crowdCols[Math.floor(Math.random()*crowdCols.length)];
    c.globalAlpha = 0.22 + Math.random()*0.45;
    c.fillStyle = col;
    c.fillRect(px, py, Math.random()<0.5?1.4:2.1, Math.random()<0.5?1.4:2.2);
  }
  c.globalAlpha = 1;

  /* --- 전광판(대형 스크린) --- */
  var jw = W*0.44, jh = H*0.115, jx = W*0.5-jw/2, jy = H*0.175;
  c.save();
  c.shadowColor = 'rgba(90,200,255,.55)'; c.shadowBlur = 16;
  c.fillStyle = '#08131f';
  c.fillRect(jx,jy,jw,jh);
  c.restore();
  c.strokeStyle = 'rgba(120,200,255,.5)'; c.lineWidth = 1.2;
  c.strokeRect(jx,jy,jw,jh);
  c.fillStyle = 'rgba(125,251,161,.88)';
  c.font = '700 '+Math.round(Math.min(13, jh*0.30))+'px ui-monospace,monospace';
  c.textAlign = 'center'; c.textBaseline = 'middle';
  c.fillText('NIGHT GAME', W*0.5, jy+jh*0.34);
  c.fillStyle = 'rgba(95,208,255,.8)';
  c.font = '700 '+Math.round(Math.min(10, jh*0.24))+'px ui-monospace,monospace';
  c.fillText('HOME RUN SHOWDOWN', W*0.5, jy+jh*0.68);

  /* --- 외야 펜스 --- */
  var basePts = [], topPts = [];
  for(var d=-58; d<=58; d+=2){
    var fp = fencePoint(d);
    var b1 = sxy(fp.x, fp.z);
    var b2 = sxyz(fp.x, 2.7, fp.z);
    basePts.push(b1); topPts.push(b2);
  }
  c.beginPath();
  c.moveTo(topPts[0][0], topPts[0][1]);
  for(var q=1;q<topPts.length;q++) c.lineTo(topPts[q][0], topPts[q][1]);
  for(var q2=basePts.length-1;q2>=0;q2--) c.lineTo(basePts[q2][0], basePts[q2][1]);
  c.closePath();
  var wg = c.createLinearGradient(0, H*0.40, 0, H*0.50);
  wg.addColorStop(0,'#1c3350');
  wg.addColorStop(0.5,'#12263c');
  wg.addColorStop(1,'#0b1a2b');
  c.fillStyle = wg; c.fill();

  /* 펜스 상단 라인 + 광고판 */
  c.beginPath();
  c.moveTo(topPts[0][0], topPts[0][1]);
  for(var q3=1;q3<topPts.length;q3++) c.lineTo(topPts[q3][0], topPts[q3][1]);
  c.strokeStyle = 'rgba(255,214,120,.85)'; c.lineWidth = 2; c.stroke();
  c.strokeStyle = 'rgba(255,214,120,.20)'; c.lineWidth = 5; c.stroke();

  var adCols = ['#24486b','#3a2a4f','#1f4a44','#4a2f2f'];
  for(var q4=6;q4<topPts.length-6;q4+=8){
    var p0 = topPts[q4], p1 = basePts[q4];
    var p2 = basePts[Math.min(q4+7, basePts.length-1)], p3 = topPts[Math.min(q4+7, topPts.length-1)];
    c.beginPath();
    c.moveTo(p0[0],p0[1]); c.lineTo(p3[0],p3[1]); c.lineTo(p2[0],p2[1]); c.lineTo(p1[0],p1[1]);
    c.closePath();
    c.fillStyle = adCols[(q4/8|0)%adCols.length];
    c.globalAlpha = 0.55; c.fill(); c.globalAlpha = 1;
  }
  /* 거리 표시 */
  c.fillStyle = 'rgba(230,240,255,.5)';
  c.font = '600 '+Math.max(7, Math.round(H*0.014))+'px ui-monospace,monospace';
  c.textAlign = 'center'; c.textBaseline = 'bottom';
  var marks = [-40,-25,0,25,40];
  for(var mi=0; mi<marks.length; mi++){
    var mp = fencePoint(marks[mi]);
    var m1 = sxyz(mp.x, 2.2, mp.z);
    c.fillText(Math.round(Math.hypot(mp.x, mp.z))+'m', m1[0], m1[1]);
  }
  /* 펜스 위 관중석 어두운 띠 */
  c.beginPath();
  c.moveTo(topPts[0][0], topPts[0][1]);
  for(var q5=1;q5<topPts.length;q5++) c.lineTo(topPts[q5][0], topPts[q5][1]);
  c.lineTo(W, H*0.40); c.lineTo(0, H*0.40); c.closePath();
  c.fillStyle = 'rgba(4,8,16,.35)'; c.fill();

  /* --- 잔디 --- */
  var fieldPath = new Path2D();
  var first = true;
  for(var d2=-58; d2<=58; d2+=2){
    var fp2 = fencePoint(d2);
    var s2 = sxy(fp2.x, fp2.z);
    if(first){ fieldPath.moveTo(s2[0],s2[1]); first=false; }
    else fieldPath.lineTo(s2[0],s2[1]);
  }
  fieldPath.lineTo(W*0.5, H*1.2);
  fieldPath.closePath();

  c.save();
  c.clip(fieldPath);
  c.fillStyle = '#0f3320';
  c.fillRect(0,H*0.38,W,H);

  /* 잔디 줄무늬 */
  var greens = ['#12401f','#0d3519'];
  for(var b=0;b<16;b++){
    var r0 = b*9, r1 = r0+9;
    var bp = new Path2D();
    var st = true;
    for(var dd=-60; dd<=60; dd+=3){
      var aa = dd*Math.PI/180;
      var pp = sxy(r1*Math.sin(aa), r1*Math.cos(aa));
      if(st){ bp.moveTo(pp[0],pp[1]); st=false; } else bp.lineTo(pp[0],pp[1]);
    }
    for(var dd2=60; dd2>=-60; dd2-=3){
      var aa2 = dd2*Math.PI/180;
      var pp2 = sxy(r0*Math.sin(aa2), r0*Math.cos(aa2));
      bp.lineTo(pp2[0],pp2[1]);
    }
    bp.closePath();
    c.fillStyle = greens[b%2];
    c.fill(bp);
  }
  /* 워닝트랙 */
  var wp = new Path2D();
  var wt = true;
  for(var dd3=-58; dd3<=58; dd3+=3){
    var a3 = dd3*Math.PI/180, r3 = fenceR(dd3);
    var p3b = sxy(r3*Math.sin(a3), r3*Math.cos(a3));
    if(wt){ wp.moveTo(p3b[0],p3b[1]); wt=false; } else wp.lineTo(p3b[0],p3b[1]);
  }
  for(var dd4=58; dd4>=-58; dd4-=3){
    var a4 = dd4*Math.PI/180, r4 = fenceR(dd4)-6;
    var p4b = sxy(r4*Math.sin(a4), r4*Math.cos(a4));
    wp.lineTo(p4b[0],p4b[1]);
  }
  wp.closePath();
  c.fillStyle = '#3a2a1c'; c.globalAlpha = 0.9; c.fill(wp); c.globalAlpha = 1;

  /* 내야 흙 */
  var inf = [[0,2],[10,6],[24,22],[12,32],[0,33],[-12,32],[-24,22],[-10,6]];
  c.beginPath();
  for(var ii=0;ii<inf.length;ii++){
    var ip = sxy(inf[ii][0], inf[ii][1]);
    if(ii===0) c.moveTo(ip[0],ip[1]); else c.lineTo(ip[0],ip[1]);
  }
  c.closePath();
  var dirt = c.createLinearGradient(0,H*0.60,0,H);
  dirt.addColorStop(0,'#7a5636');
  dirt.addColorStop(1,'#5e4026');
  c.fillStyle = dirt; c.fill();

  /* 내야 잔디 다이아몬드 */
  var ing = [[0,6],[14,18],[0,30],[-14,18]];
  c.beginPath();
  for(var gi=0;gi<ing.length;gi++){
    var gp = sxy(ing[gi][0], ing[gi][1]);
    if(gi===0) c.moveTo(gp[0],gp[1]); else c.lineTo(gp[0],gp[1]);
  }
  c.closePath();
  c.fillStyle = '#123f20'; c.fill();

  /* 파울 라인 */
  c.strokeStyle = 'rgba(240,248,255,.68)'; c.lineWidth = 2;
  [-1,1].forEach(function(sg){
    c.beginPath();
    for(var t2=0;t2<=62;t2+=2){
      var lp = sxy(sg*t2, t2);
      if(t2===0) c.moveTo(lp[0],lp[1]); else c.lineTo(lp[0],lp[1]);
    }
    c.stroke();
  });

  /* 마운드 */
  var mp2 = sxy(0,18);
  c.beginPath();
  c.ellipse(mp2[0], mp2[1], W*0.045, H*0.013, 0, 0, 6.2832);
  c.fillStyle = '#8a6135'; c.fill();
  c.strokeStyle = 'rgba(255,255,255,.18)'; c.lineWidth = 1;
  c.beginPath();
  c.ellipse(mp2[0], mp2[1]-1, W*0.045, H*0.013, 0, 0, 6.2832); c.stroke();

  /* 베이스 */
  [[19,19],[0,27],[-19,19]].forEach(function(bs){
    var bp2 = sxy(bs[0], bs[1]);
    var sz = Math.max(3, 5*proj(bs[1]));
    c.save();
    c.translate(bp2[0], bp2[1]);
    c.fillStyle = '#f4f7ff';
    c.strokeStyle = 'rgba(0,0,0,.35)';
    c.beginPath();
    c.moveTo(0,-sz); c.lineTo(sz,0); c.lineTo(0,sz); c.lineTo(-sz,0); c.closePath();
    c.fill(); c.stroke();
    c.restore();
  });
  /* 홈플레이트 */
  var hp = sxy(0, 0.4);
  c.fillStyle = '#f6f9ff';
  c.beginPath();
  c.moveTo(hp[0]-6, hp[1]-2); c.lineTo(hp[0]+6, hp[1]-2);
  c.lineTo(hp[0]+6, hp[1]+2); c.lineTo(hp[0], hp[1]+7);
  c.lineTo(hp[0]-6, hp[1]+2); c.closePath(); c.fill();

  /* 타자석/대기 타석 흙 자국 */
  c.fillStyle = 'rgba(0,0,0,.18)';
  c.beginPath(); c.ellipse(W*0.38, H*0.95, W*0.10, H*0.018, -0.1, 0, 6.2832); c.fill();

  c.restore(); /* clip end */

  /* --- 조명탑 --- */
  drawLights(c);

  /* 하단 비네트 */
  var vg = c.createLinearGradient(0,H*0.7,0,H);
  vg.addColorStop(0,'rgba(0,0,0,0)');
  vg.addColorStop(1,'rgba(0,0,0,.42)');
  c.fillStyle = vg; c.fillRect(0,H*0.7,W,H*0.3);
}

function drawLights(c){
  var towers = [[0.10,0.06],[0.33,0.02],[0.67,0.02],[0.90,0.06]];
  c.save();
  for(var i=0;i<towers.length;i++){
    var tx = W*towers[i][0], ty = H*towers[i][1];
    /* 기둥 */
    c.strokeStyle = 'rgba(160,190,225,.35)';
    c.lineWidth = 1.6;
    c.beginPath();
    c.moveTo(tx, ty+H*0.03);
    c.lineTo(tx, H*0.26);
    c.stroke();
    /* 램프 */
    c.fillStyle = '#dbeaff';
    c.globalAlpha = 0.9;
    c.fillRect(tx-W*0.035, ty, W*0.07, H*0.024);
    c.globalAlpha = 1;
    /* 빛 번짐 */
    c.globalCompositeOperation = 'lighter';
    var lg = c.createRadialGradient(tx, ty+H*0.012, 1, tx, ty+H*0.012, H*0.16);
    lg.addColorStop(0,'rgba(190,225,255,.55)');
    lg.addColorStop(0.25,'rgba(150,200,255,.16)');
    lg.addColorStop(1,'rgba(120,170,240,0)');
    c.fillStyle = lg;
    c.beginPath(); c.arc(tx, ty+H*0.012, H*0.16, 0, 6.2832); c.fill();
    /* 빛줄기 */
    var cone = c.createLinearGradient(tx, ty, tx, H*0.55);
    cone.addColorStop(0,'rgba(200,225,255,.16)');
    cone.addColorStop(1,'rgba(200,225,255,0)');
    c.fillStyle = cone;
    c.beginPath();
    c.moveTo(tx-W*0.028, ty+H*0.02);
    c.lineTo(tx+W*0.028, ty+H*0.02);
    c.lineTo(tx+W*0.16, H*0.55);
    c.lineTo(tx-W*0.16, H*0.55);
    c.closePath(); c.fill();
    c.globalCompositeOperation = 'source-over';
  }
  c.restore();
}

/* ============================================================
   6. 전광판/UI 갱신
   ============================================================ */
function setDots(el, n, max, cls){
  var s = '';
  for(var i=0;i<max;i++) s += '<i class="'+(i<n?('on'+(cls?' '+cls:'')):'')+'"></i>';
  el.innerHTML = s;
}
function updateBoard(){
  $('sA').textContent = G.score[0];
  $('sB').textContent = G.score[1];
  var isDerby = (G.mode==='derby');
  $('bInn').textContent = isDerby ? '더비' : (G.inning+'회');
  $('bHalf').textContent = isDerby ? '⚾' : (G.half===0 ? '▲' : '▼');
  $('tnA').textContent = isDerby ? '나' : '청팀';
  $('tnB').textContent = isDerby ? 'AI' : '홍팀';
  if(isDerby){
    $('dB').parentNode.style.display='none';
    $('dS').parentNode.style.display='none';
    $('dO').parentNode.style.display='none';
    $('situ').textContent = '남은 공 '+(G.derby.total-G.derby.n)+' · 홈런 '+G.derby.hr+' · 최장 '+Math.round(G.derby.bestDist)+'m';
  }else{
    $('dB').parentNode.style.display='';
    $('dS').parentNode.style.display='';
    $('dO').parentNode.style.display='';
    setDots($('dB'), G.balls, 3);
    setDots($('dS'), G.strikes, 2);
    setDots($('dO'), G.outs, 2, 'pink');
    var sit = G.outs+'사';
    var bs = [];
    if(G.bases[0]) bs.push('1루');
    if(G.bases[1]) bs.push('2루');
    if(G.bases[2]) bs.push('3루');
    if(bs.length) sit += ' ' + bs.join('·');
    if(G.balls===0 && G.strikes===0) sit += ' · 새 타자';
    $('situ').textContent = sit;
  }
  $('t0src');
  $('metaL').textContent = labelBatter();
  $('metaR').textContent = (G.mode==='derby') ? ('타구 '+G.derby.n+'/'+G.derby.total) : (G.balls+'-'+G.strikes+' 카운트');
}
function labelBatter(){
  if(G.mode==='derby') return '나 · 타자';
  if(G.mode==='ai3') return '청팀 타자 · 나';
  return (G.battingTeam===0 ? '⚡ 청팀 타자' : '🔥 홍팀 타자');
}
function labelPitcher(){
  if(G.mode==='ai3' || G.mode==='derby') return 'AI 투수';
  return (G.battingTeam===0 ? '🔥 홍팀 투수' : '⚡ 청팀 투수');
}

var bigTimer = null;
function showBig(main, sub, color, ms){
  var el = $('bigText');
  el.querySelector('b').textContent = main;
  el.querySelector('b').style.color = color || '#fff';
  el.querySelector('span').textContent = sub || '';
  el.classList.remove('show');
  void el.offsetWidth;
  el.classList.add('show');
  if(bigTimer) clearTimeout(bigTimer);
  bigTimer = setTimeout(function(){ el.classList.remove('show'); }, ms||1100);
}
function showLog(text){
  var box = $('aiLog');
  var s = document.createElement('span');
  s.textContent = text;
  box.appendChild(s);
  while(box.children.length>5) box.removeChild(box.firstChild);
  setTimeout(function(){ if(s.parentNode) s.parentNode.removeChild(s); }, 3200);
}

   7. 그리기 (동적)
   ============================================================ */
function drawCrowdFx(dt){
  /* 관중 플래시 */
  if(Math.random()<0.5){
    CROWD_FLASH.push({ x:Math.random()*W, y:H*(0.20+Math.random()*0.20), life:0.35, max:0.35 });
  }
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  for(var i=CROWD_FLASH.length-1;i>=0;i--){
    var f = CROWD_FLASH[i];
    f.life -= dt;
    if(f.life<=0){ CROWD_FLASH.splice(i,1); continue; }
    var a = (f.life/f.max)*0.5;
    ctx.fillStyle = 'rgba(255,255,235,'+a.toFixed(2)+')';
    ctx.beginPath(); ctx.arc(f.x,f.y,1.6,0,6.2832); ctx.fill();
  }
  ctx.restore();
}

function figureAt(x, z, hgt, jersey, opts){
  var p = proj(z);
  var base = sxy(x, z);
  var h = hgt*p*H*CAM.hy;
  var cx2 = base[0], by = base[1];
  /* 그림자 */
  ctx.fillStyle = 'rgba(0,0,0,.35)';
  ctx.beginPath();
  ctx.ellipse(cx2, by+1, h*0.22, h*0.055, 0, 0, 6.2832);
  ctx.fill();
  /* 다리 */
  ctx.strokeStyle = '#d7e3f5';
  ctx.lineWidth = Math.max(1.4, h*0.075);
  ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.moveTo(cx2-h*0.07, by);
  ctx.lineTo(cx2-h*0.02, by-h*0.42);
  ctx.moveTo(cx2+h*0.07, by);
  ctx.lineTo(cx2+h*0.02, by-h*0.42);
  ctx.stroke();
  /* 몸통 */
  ctx.fillStyle = jersey;
  ctx.beginPath();
  ctx.moveTo(cx2-h*0.13, by-h*0.40);
  ctx.lineTo(cx2+h*0.13, by-h*0.40);
  ctx.lineTo(cx2+h*0.11, by-h*0.74);
  ctx.lineTo(cx2-h*0.11, by-h*0.74);
  ctx.closePath();
  ctx.fill();
  /* 머리 */
  ctx.fillStyle = '#0b1a2a';
  ctx.beginPath();
  ctx.arc(cx2, by-h*0.84, h*0.095, 0, 6.2832);
  ctx.fill();
  ctx.fillStyle = jersey;
  ctx.beginPath();
  ctx.arc(cx2, by-h*0.855, h*0.10, Math.PI, Math.PI*2);
  ctx.fill();
  return { cx:cx2, by:by, h:h };
}

function drawPitcher(anim){
  var mound = sxy(0, 17.4);
  var p = figureAt(0, 17.4, 2.05, G.battingTeam===0 ? '#ff6b9d' : '#5fd0ff');
  var h = p.h;
  /* 팔 */
  ctx.strokeStyle = G.battingTeam===0 ? '#ff6b9d' : '#5fd0ff';
  ctx.lineWidth = Math.max(1.4, h*0.07);
  ctx.lineCap='round';
  var ang;
  if(anim==='wind'){
    var t = clamp((now()-P.releaseAt+0.55)/0.55, 0, 1);
    ang = -2.2 + t*3.4;
  }else{
    ang = -0.7 + Math.sin(now()*1.6)*0.12;
  }
  var sx0 = p.cx + h*0.10, sy0 = p.by - h*0.68;
  ctx.beginPath();
  ctx.moveTo(sx0, sy0);
  ctx.lineTo(sx0 + Math.cos(ang)*h*0.34, sy0 + Math.sin(ang)*h*0.34);
  ctx.stroke();
  /* 글러브 */
  ctx.fillStyle = '#8a5a2b';
  ctx.beginPath();
  ctx.arc(p.cx - h*0.16, p.by - h*0.60, h*0.075, 0, 6.2832);
  ctx.fill();
}

function drawBatter(){
  var bx0 = W*0.5 - W*0.105;
  var by0 = H*0.955;
  var h = H*0.175;
  var jersey = (G.mode==='derby') ? '#5fd0ff' : (G.battingTeam===0 ? '#5fd0ff' : '#ff6b9d');
  var swingP = 0;
  if(SWING.on){
    swingP = clamp((now()-SWING.t0)/SWING.dur, 0, 1);
    if(swingP>=1) SWING.on = false;
  }
  /* 그림자 */
  ctx.fillStyle='rgba(0,0,0,.40)';
  ctx.beginPath(); ctx.ellipse(bx0, by0+2, h*0.30, h*0.07, 0, 0, 6.2832); ctx.fill();
  /* 다리 */
  ctx.strokeStyle='#e6eefc'; ctx.lineWidth=Math.max(2, h*0.085); ctx.lineCap='round';
  ctx.beginPath();
  ctx.moveTo(bx0-h*0.10, by0); ctx.lineTo(bx0-h*0.02, by0-h*0.44);
  ctx.moveTo(bx0+h*0.12, by0); ctx.lineTo(bx0+h*0.03, by0-h*0.44);
  ctx.stroke();
  /* 몸통 */
  var lean = Math.sin(swingP*Math.PI)*h*0.05;
  ctx.fillStyle = jersey;
  ctx.beginPath();
  ctx.moveTo(bx0-h*0.17, by0-h*0.42);
  ctx.lineTo(bx0+h*0.16, by0-h*0.42);
  ctx.lineTo(bx0+h*0.13+lean, by0-h*0.76);
  ctx.lineTo(bx0-h*0.14+lean, by0-h*0.76);
  ctx.closePath(); ctx.fill();
  /* 등번호 */
  ctx.fillStyle='rgba(10,20,35,.75)';
  ctx.font='700 '+Math.round(h*0.14)+'px ui-monospace,monospace';
  ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.fillText('7', bx0+lean, by0-h*0.58);
  /* 머리 + 헬멧 */
  ctx.fillStyle='#0b1a2a';
  ctx.beginPath(); ctx.arc(bx0+lean*0.6, by0-h*0.87, h*0.10, 0, 6.2832); ctx.fill();
  ctx.fillStyle = jersey;
  ctx.beginPath(); ctx.arc(bx0+lean*0.6, by0-h*0.885, h*0.105, Math.PI, Math.PI*2); ctx.fill();
  ctx.fillRect(bx0+lean*0.6+h*0.06, by0-h*0.885, h*0.06, h*0.03);
  /* 배트 */
  var shoulderX = bx0 + h*0.10 + lean, shoulderY = by0 - h*0.70;
  var batAng;
  if(SWING.on){
    batAng = -1.9 + swingP*3.5;
  }else{
    batAng = -2.05 + Math.sin(now()*2.0)*0.05;
  }
  var bLen = h*0.62;
  ctx.strokeStyle = '#f0d9a8';
  ctx.lineWidth = Math.max(2, h*0.045);
  ctx.beginPath();
  ctx.moveTo(shoulderX, shoulderY);
  ctx.lineTo(shoulderX + Math.cos(batAng)*bLen*0.35, shoulderY + Math.sin(batAng)*bLen*0.35);
  ctx.stroke();
  ctx.strokeStyle = '#fff3d0';
  ctx.lineWidth = Math.max(2.4, h*0.055);
  ctx.beginPath();
  ctx.moveTo(shoulderX + Math.cos(batAng)*bLen*0.32, shoulderY + Math.sin(batAng)*bLen*0.32);
  ctx.lineTo(shoulderX + Math.cos(batAng)*bLen*0.7, shoulderY + Math.sin(batAng)*bLen*0.7);
  ctx.stroke();
  /* 스윙 잔상 */
  if(SWING.on && swingP>0.15 && swingP<0.85){
    ctx.save();
    ctx.globalAlpha = 0.35*(1-Math.abs(swingP-0.5)*2)+0.1;
    ctx.strokeStyle = '#ffe9a8';
    ctx.lineWidth = Math.max(2, h*0.05);
    ctx.beginPath();
    ctx.arc(shoulderX, shoulderY, bLen*0.6, -1.9+ (swingP-0.35)*3.2, -1.9+swingP*3.2);
    ctx.stroke();
    ctx.restore();
  }
}

function drawFielders(){
  var pos = [[-52,76],[0,88],[52,76],[-20,32],[20,32],[26,20],[-26,20]];
  for(var i=0;i<pos.length;i++){
    figureAt(pos[i][0], pos[i][1], 1.85, '#26364d');
  }
}

function drawZone(){
  if(G.scene!=='play') return;
  var visible = (G.phase==='windup' || G.phase==='flight');
  if(!visible) return;
  ctx.save();
  ctx.globalAlpha = 0.22;
  ctx.strokeStyle = '#bfe9ff';
  ctx.lineWidth = 1.4;
  ctx.setLineDash([5,5]);
  ctx.strokeRect(ZONE.cx-ZONE.hw, ZONE.cy-ZONE.hh, ZONE.hw*2, ZONE.hh*2);
  ctx.restore();
}

function laneFor(course){
  if(course==='in') return -0.62;
  if(course==='out') return 0.62;
  if(course==='wild') return (Math.random()<0.5?-1.45:1.45);
  return 0;
}
function heightFor(course, type){
  if(course==='wild') return (Math.random()<0.5?-1.35:1.3);
  var base = (course==='in') ? 0.10 : (course==='out' ? -0.10 : 0);
  if(type==='curve') base -= 0.32;
  if(type==='change') base -= 0.18;
  return base + rnd(-0.18,0.18);
}

function drawPitch(){
  if(!P.active) return;
  var t = now();
  if(t < P.releaseAt) return;
  var raw = clamp((t-P.releaseAt)/P.flight, 0, 1.08);
  var prog = raw;
  if(P.type==='change') prog = 1-Math.pow(1-Math.min(raw,1),1.85);
  else if(P.type==='curve') prog = Math.pow(Math.min(raw,1),0.94);

  var zx = ZONE.cx + P.lane*ZONE.hw;
  var zy = ZONE.cy + P.hgt*ZONE.hh;
  if(P.type==='curve'){
    zx += Math.sin(Math.min(prog,1)*Math.PI*0.9)*ZONE.hw*0.55;
  }
  if(P.type==='change'){
    zy += Math.pow(Math.min(prog,1),2.4)*ZONE.hh*0.55;
  }
  var rx = W*0.5 + W*0.02, ry = H*0.585;
  var x = rx + (zx-rx)*prog;
  var y = ry + (zy-ry)*prog;
  var rad = 3.2 + 7.4*Math.min(raw,1);
  /* 궤적 */
  ctx.save();
  ctx.globalCompositeOperation='lighter';
  for(var i=1;i<=6;i++){
    var pp = clamp(prog - i*0.035, 0, 1);
    var zx2 = ZONE.cx + P.lane*ZONE.hw;
    var zy2 = ZONE.cy + P.hgt*ZONE.hh;
    if(P.type==='curve') zx2 += Math.sin(pp*Math.PI*0.9)*ZONE.hw*0.55;
    if(P.type==='change') zy2 += Math.pow(pp,2.4)*ZONE.hh*0.55;
    var xx = rx + (zx2-rx)*pp, yy = ry + (zy2-ry)*pp;
    ctx.fillStyle = 'rgba(255,250,230,'+(0.16*(1-i/7)).toFixed(3)+')';
    ctx.beginPath(); ctx.arc(xx,yy, rad*(0.55-i*0.05), 0, 6.2832); ctx.fill();
  }
  ctx.restore();
  /* 공 */
  var g = ctx.createRadialGradient(x-rad*0.3, y-rad*0.3, 0.5, x, y, rad);
  g.addColorStop(0,'#ffffff'); g.addColorStop(0.7,'#f4f6ff'); g.addColorStop(1,'#c8d4e8');
  ctx.fillStyle = g;
  ctx.beginPath(); ctx.arc(x,y,Math.max(2,rad),0,6.2832); ctx.fill();
  if(raw>=1){ /* 포수 미트 도달 */
    ctx.strokeStyle='rgba(255,255,255,.35)';
    ctx.lineWidth=1;
    ctx.beginPath(); ctx.arc(x,y,rad*1.9,0,6.2832); ctx.stroke();
  }
  P.px = x; P.py = y;
}

function startFly(kind, dist, angleDeg, heightMo){
  var theta = (heightMo||32)*Math.PI/180;
  var g = 9.8;
  var v = Math.sqrt(Math.max(4,dist)*g/Math.sin(2*theta));
  var ang = angleDeg*Math.PI/180;
  FLY.on = true;
  FLY.x = 0; FLY.y = 1.1; FLY.z = 0.6;
  FLY.vx = v*Math.cos(theta)*Math.sin(ang);
  FLY.vz = v*Math.cos(theta)*Math.cos(ang);
  FLY.vy = v*Math.sin(theta);
  FLY.t = 0; FLY.landed = false; FLY.trail = []; FLY.kind = kind;
  FLY.landX = 0; FLY.landZ = 0;
}
function updateFly(dt){
  if(!FLY.on) return;
  var ts = 0.62;
  var steps = 3, sdt = (dt*ts)/steps;
  for(var s=0;s<steps;s++){
    FLY.t += sdt;
    FLY.vy -= 9.8*sdt;
    FLY.x += FLY.vx*sdt;
    FLY.y += FLY.vy*sdt;
    FLY.z += FLY.vz*sdt;
    if(FLY.y<=0.05 && FLY.t>0.15){
      FLY.y = 0.05;
      if(!FLY.landed){
        FLY.landed = true;
        FLY.landX = FLY.x; FLY.landZ = FLY.z;
        dustAt(FLY.x, FLY.z, FLY.kind);
        FLY.offT = 0;
      }
      FLY.vx*=0.90; FLY.vz*=0.90;
      FLY.offT = (FLY.offT||0) + sdt;
      if(FLY.offT>0.6) FLY.on = false;
    }
  }
  if(FLY.z<0.5 && FLY.t>0.6) FLY.on=false;
}
function drawFly(){
  if(!FLY.on) return;
  var pos = sxyz(FLY.x, Math.max(0,FLY.y), Math.max(0.4,FLY.z));
  var sh = sxy(FLY.x, Math.max(0.4,FLY.z));
  var p = proj(FLY.z);
  var rad = clamp(2.4, 9*Math.pow(p,0.75), 11);
  /* 그림자 */
  ctx.fillStyle = 'rgba(0,0,0,'+(0.30*clamp(1-FLY.y/16,0.15,1)).toFixed(2)+')';
  ctx.beginPath(); ctx.ellipse(sh[0], sh[1], rad*1.5, rad*0.6, 0, 0, 6.2832); ctx.fill();
  /* 잔상 */
  ctx.save();
  ctx.globalCompositeOperation='lighter';
  for(var i=0;i<FLY.trail.length;i++){
    var tp = FLY.trail[i];
    var a = (i/FLY.trail.length)*0.35;
    ctx.fillStyle = 'rgba(255,240,190,'+a.toFixed(3)+')';
    ctx.beginPath(); ctx.arc(tp[0], tp[1], rad*(0.35+i/FLY.trail.length*0.5), 0, 6.2832); ctx.fill();
  }
  ctx.restore();
  ctx.fillStyle = '#fffaf0';
  ctx.beginPath(); ctx.arc(pos[0], pos[1], rad, 0, 6.2832); ctx.fill();
  ctx.strokeStyle='rgba(180,200,230,.7)'; ctx.lineWidth=0.8; ctx.stroke();
  FLY.trail.push([pos[0], pos[1]]);
  if(FLY.trail.length>10) FLY.trail.shift();
  /* 착지 지점 링 */
  if(FLY.landed){
    var lp = sxy(FLY.landX, FLY.landZ);
    var tt = clamp((FLY.offT||0)/0.6,0,1);
    ctx.strokeStyle = 'rgba(255,230,150,'+(0.7*(1-tt)).toFixed(2)+')';
    ctx.lineWidth = 2;
    ctx.beginPath(); ctx.ellipse(lp[0], lp[1], 8+tt*22, (8+tt*22)*0.4, 0, 0, 6.2832); ctx.stroke();
  }
}

function dustAt(x,z,kind){
  var s = sxy(x,z);
  var col = (kind==='HR') ? '255,220,140' : '200,215,235';
  for(var i=0;i<16;i++){
    PARTS.push({
      x:s[0], y:s[1],
      vx:rnd(-60,60), vy:rnd(-70,-10),
      life:rnd(0.3,0.7), max:0.7, size:rnd(1.2,3), col:col
    });
  }
}
function burst(x,y,col,n){
  for(var i=0;i<n;i++){
    var a = rnd(0,6.2832), sp = rnd(30,150);
    PARTS.push({
      x:x, y:y, vx:Math.cos(a)*sp, vy:Math.sin(a)*sp,
      life:rnd(0.6,1.5), max:1.5, size:rnd(1.4,3.2), col:col, grav:60
    });
  }
}
function drawParts(dt){
  ctx.save();
  ctx.globalCompositeOperation='lighter';
  for(var i=PARTS.length-1;i>=0;i--){
    var p = PARTS[i];
    p.life -= dt;
    if(p.life<=0){ PARTS.splice(i,1); continue; }
    p.x += p.vx*dt; p.y += p.vy*dt;
    p.vy += (p.grav||120)*dt;
    var a = clamp(p.life/p.max, 0, 1);
    ctx.fillStyle = 'rgba('+p.col+','+(a*0.85).toFixed(2)+')';
    ctx.beginPath(); ctx.arc(p.x,p.y,p.size*a+0.6,0,6.2832); ctx.fill();
  }
  ctx.restore();
}

function render(dt){
  ctx.clearRect(0,0,W,H);
  ctx.drawImage(bg, 0, 0, W, H);
  drawCrowdFx(dt);
  drawFielders();
  drawZone();
  drawPitcher(G.phase==='windup'?'wind':'idle');
  drawBatter();
  drawPitch();
  updateFly(dt);
  drawFly();
  drawParts(dt);
}

/* ============================================================
   8. 게임 흐름
   ============================================================ */
function isAiPitching(){ return (G.mode==='derby' || G.mode==='ai3'); }

function setSwingEnabled(on){
  var b = $('btnSwing');
  if(on) b.classList.remove('disabled');
  else b.classList.add('disabled');
  $('swingSub').textContent = on ? (G.mode==='derby' ? '타이밍에 맞춰 터치!' : '공이 오면 타이밍에 맞춰 터치') : '투구를 기다리는 중…';
}
function setPitchUI(on){
  var panel = $('pitchPanel');
  panel.classList.toggle('locked', !on);
  $('btnThrow').disabled = !on;
  $('pWho').textContent = labelPitcher();
  Array.prototype.forEach.call(panel.querySelectorAll('.chip'), function(ch){
    ch.disabled = !on;
  });
}

function aiPick(){
  var r = Math.random(), type;
  if(r<0.50) type='fast';
  else if(r<0.79) type='curve';
  else type='change';
  var rc = Math.random(), course;
  if(rc<0.14) course='wild';
  else if(rc<0.44) course='in';
  else if(rc<0.74) course='mid';
  else course='out';
  return { type:type, course:course };
}

function nextBatter(){
  G.balls=0; G.strikes=0;
  G.phase='pre';
  updateBoard();
  setSwingEnabled(false);
  if(isAiPitching()){
    setPitchUI(false);
    var tok = G.token;
    setTimeout(function(){
      if(G.token!==tok || G.scene!=='play' || G.phase!=='pre') return;
      doPitch(aiPick());
    }, G.mode==='derby'?780:820);
  }else{
    setPitchUI(true);
    G.sel = { type:'fast', course:'mid' };
    syncChips();
  }
}

function doPitch(sel){
  if(G.scene!=='play') return;
  P.type = sel.type;
  P.course = sel.course;
  P.wild = (sel.course==='wild') || (Math.random()< (G.mode==='2p'?0.06:0.0));
  if(P.wild && sel.course!=='wild') P.course='wild';
  P.flight = TYPE[sel.type].flight + rnd(-0.035,0.035);
  P.lane = laneFor(P.course);
  P.hgt = heightFor(P.course, sel.type);
  P.active = true; P.resolved=false; P.swung=false; P.off=0;
  G.phase='windup';
  var t = now();
  P.releaseAt = t + 0.55;
  P.arriveAt = P.releaseAt + P.flight;
  setPitchUI(false);
  setSwingEnabled(true);
  var tok = G.token;
  setTimeout(function(){ if(G.token===tok && P.active && !P.resolved) A.whoosh(); }, 540);
  setTimeout(function(){
    if(G.token!==tok || G.scene!=='play') return;
    if(!P.active || P.resolved) return;
    resolveTake();
  }, Math.round(550 + (P.flight+0.30)*1000));
  updateBoard();
}

function onSwing(){
  if(G.scene!=='play') return;
  if(!P.active || P.resolved) return;
  if(G.phase==='pre' || G.phase==='idle') return;
  var t = now();
  if(t < P.releaseAt-0.05) return; /* 투구 동작 중 터치는 무시 */
  P.swung = true;
  P.off = t - P.arriveAt;
  SWING.on = true; SWING.t0 = t;
  buzz(6);
  resolveSwing(P.off);
}

function resolveSwing(off){
  P.active = true;
  P.resolved = true;
  G.phase='resolve';
  setSwingEnabled(false);
  setPitchUI(false);
  var a = Math.abs(off);
  var WIN = 0.155;
  if(a >= WIN){
    /* 헛스윙 */
    A.whiff();
    G.strikes++;
    if(G.mode==='derby'){ G.derby.n++; }
    if(G.mode==='derby'){
      showBig('헛스윙!', (off<0?'조금 빨랐어요':'조금 늦었어요'), '#9fb6d2', 850);
      updateBoard();
      postPitch(false, 900);
      return;
    }
    if(G.strikes>=3){
      G.outs++;
      showBig('삼진 아웃!', '', '#ff6b9d', 1250);
      updateBoard();
      A.strike();
      postPitch(true, 1350);
    }else{
      showBig('헛스윙!', '스트라이크', '#ffcc66', 800);
      updateBoard();
      postPitch(false, 900);
    }
    return;
  }

  var q = clamp(1 - a/WIN, 0, 1);
  if(P.type==='change' && off < -0.035) q -= 0.17;
  if(P.type==='curve' && off > 0.045) q -= 0.13;
  if(P.course==='wild') q *= 0.55;
  q += rnd(-0.06,0.06);
  q = clamp(q, 0, 1);

  var kind = outcomeFromQ(q);
  var dir = 0;
  if(P.course==='in') dir = -1;
  else if(P.course==='out') dir = 1;
  else dir = (Math.random()<0.5?-1:1)*0.4;

  var dist = 0, ang = 0, launch = 32;
  if(kind==='HR'){
    dist = 103 + q*32 + rnd(0,13);
    ang = dir*rnd(4,24);
    launch = rnd(26,34);
  }else if(kind==='3B'){
    dist = 74 + q*16 + rnd(0,8);
    ang = (dir||1)*rnd(26,42);
    launch = 26;
  }else if(kind==='2B'){
    dist = 58 + q*28 + rnd(0,10);
    ang = dir*rnd(8,34);
    launch = 27;
  }else if(kind==='1B'){
    dist = 22 + q*45 + rnd(0,12);
    ang = dir*rnd(4,30);
    launch = 18;
  }else if(kind==='FO'){
    dist = 42 + q*48 + rnd(0,10);
    ang = dir*rnd(2,30);
    launch = rnd(38,48);
  }else{ /* FOUL */
    dist = 26 + q*55 + rnd(0,18);
    ang = (dir||1)*rnd(44,72);
    launch = rnd(26,44);
  }

  A.crack(q);
  startFly(kind==='FOUL'?'FOUL':kind, dist, ang, launch);
  buzz(kind==='HR'?[18,50,30]:[8]);

  var distTxt = Math.round(dist)+'m';
  if(kind==='HR'){
    showBig('홈 런 !!', distTxt+' · '+(P.type==='fast'?'직구':TYPE[P.type].name)+'를 잡아당겼다', '#ffd76a', 1700);
    A.hr();
    fireworks();
    if(G.mode==='derby'){
      G.derby.n++; G.derby.hr++; G.derby.hits++;
      G.derby.sumDist += dist;
      if(dist>G.derby.bestDist) G.derby.bestDist = dist;
      G.derby.list.push({k:'HR',d:Math.round(dist)});
    }else{
      applyHit('HR', Math.round(dist));
      updateBoard();
    }
    postPitch(G.mode!=='derby', 2000);
    return;
  }
  if(kind==='3B'||kind==='2B'||kind==='1B'){
    var nm = kind==='3B'?'3루타!':(kind==='2B'?'2루타!':'안타!');
    var col = kind==='1B'?'#a8e6ff':'#7dfba1';
    showBig(nm, distTxt, col, 1200);
    A.cheer();
    if(G.mode==='derby'){
      G.derby.n++; G.derby.hits++;
      G.derby.sumDist += dist;
      if(dist>G.derby.bestDist) G.derby.bestDist=dist;
      G.derby.list.push({k:kind,d:Math.round(dist)});
    }else{
      applyHit(kind, Math.round(dist));
      updateBoard();
    }
    postPitch(G.mode!=='derby', 1500);
    return;
  }
  if(kind==='FO'){
    showBig('플라이 아웃', distTxt, '#9fb6d2', 1150);
    A.crowd(0.5,0.07);
    if(G.mode==='derby'){
      G.derby.n++;
      G.derby.list.push({k:'FO',d:Math.round(dist)});
    }else{
      G.outs++;
      updateBoard();
    }
    postPitch(G.mode!=='derby', 1400);
    return;
  }
  /* FOUL */
  showBig('파울!', '아슬아슬했어요', '#c9d8ea', 950);
  A.crowd(0.4,0.06);
  if(G.mode==='derby'){ G.derby.n++; G.derby.list.push({k:'FOUL',d:0}); }
  else if(G.strikes<2) G.strikes++;
  updateBoard();
  postPitch(false, 1000);
}

function outcomeFromQ(q){
  var r = Math.random();
  if(q>=0.86){
    if(r<0.54) return 'HR';
    if(r<0.66) return '2B';
    if(r<0.72) return '3B';
    return '1B';
  }
  if(q>=0.70){
    if(r<0.07) return 'HR';
    if(r<0.30) return '2B';
    if(r<0.34) return '3B';
    if(r<0.72) return '1B';
    if(r<0.86) return 'FO';
    return 'FOUL';
  }
  if(q>=0.50){
    if(r<0.32) return '1B';
    if(r<0.40) return '2B';
    if(r<0.70) return 'FO';
    return 'FOUL';
  }
  if(q>=0.30){
    if(r<0.16) return '1B';
    if(r<0.38) return 'FO';
    return 'FOUL';
  }
  if(r<0.10) return '1B';
  if(r<0.28) return 'FO';
  return 'FOUL';
}

function resolveTake(){
  if(!P.active || P.resolved) return;
  P.resolved = true;
  G.phase='resolve';
  setSwingEnabled(false);
  setPitchUI(false);
  var wasBall = P.wild || P.course==='wild';
  if(G.mode==='derby'){
    G.derby.n++;
    G.derby.list.push({k: wasBall?'BALL':'TAKE', d:0});
    if(wasBall){ showBig('볼', '지켜봤어요', '#5fd0ff', 800); A.ball(); }
    else { showBig('스트라이크', '지켜봤어요', '#ffcc66', 800); A.strike(); }
    updateBoard();
    postPitch(false, 850);
    return;
  }
  if(wasBall){
    G.balls++;
    A.ball();
    if(G.balls>=4){
      showBig('볼넷', '1루로 나가요', '#5fd0ff', 1200);
      applyWalk();
      updateBoard();
      postPitch(true, 1350);
    }else{
      showBig('볼', '', '#5fd0ff', 700);
      updateBoard();
      postPitch(false, 850);
    }
    return;
  }
  G.strikes++;
  A.strike();
  if(G.strikes>=3){
    G.outs++;
    showBig('삼진 아웃!', '지켜봤어요', '#ff6b9d', 1250);
    updateBoard();
    postPitch(true, 1350);
  }else{
    showBig('스트라이크', '', '#ffcc66', 750);
    updateBoard();
    postPitch(false, 850);
  }
}

function postPitch(paEnded, delay){
  P.active = false;
  var tok = G.token;
  setTimeout(function(){
    if(G.token!==tok || G.scene!=='play') return;
    if(G.mode==='derby'){
      if(G.derby.n >= G.derby.total){ endGame(); return; }
      nextBatter();
      return;
    }
    if(paEnded){
      if(G.outs>=3){ endHalfInning(); return; }
      nextBatter();
    }else{
      G.phase='pre';
      updateBoard();
      if(isAiPitching()){
        var t2 = G.token;
        setTimeout(function(){
          if(G.token!==t2 || G.scene!=='play' || G.phase!=='pre') return;
          doPitch(aiPick());
        }, 620);
      }else{
        setPitchUI(true);
        G.sel = { type:'fast', course:'mid' };
        syncChips();
      }
    }
  }, delay||900);
}

function applyHit(kind, dist){
  var b = G.bases, runs = 0;
  if(kind==='HR'){
    runs = (b[0]?1:0)+(b[1]?1:0)+(b[2]?1:0)+1;
    G.bases = [false,false,false];
  }else if(kind==='3B'){
    runs = (b[0]?1:0)+(b[1]?1:0)+(b[2]?1:0);
    G.bases = [false,false,true];
  }else if(kind==='2B'){
    if(b[2]) runs++;
    if(b[1]) runs++;
    G.bases = [false, true, b[0]];
  }else{
    if(b[2]) runs++;
    G.bases = [true, b[0], b[1]];
  }
  G.score[G.battingTeam] += runs;
  if(runs>0 && kind!=='HR'){
    setTimeout(function(){ if(G.scene==='play'){ showBig(runs+'점!', '주자가 홈으로', '#7dfba1', 1000); A.cheer(); } }, 700);
  }
}
function applyWalk(){
  var b = G.bases, runs = 0;
  if(b[0]&&b[1]&&b[2]) runs = 1;
  else if(b[0]&&b[1]) b[2] = true;
  else if(b[0]) b[1] = true;
  b[0] = true;
  G.score[G.battingTeam] += runs;
}

function endHalfInning(){
  G.outs=0; G.balls=0; G.strikes=0; G.bases=[false,false,false];
  G.phase='idle';
  var tok = G.token;
  if(G.battingTeam===0){ G.battingTeam=1; G.half=1; }
  else { G.battingTeam=0; G.half=0; G.inning++; }
  updateBoard();
  if(G.inning > G.innings){
    setTimeout(function(){ if(G.token===tok) endGame(); }, 900);
    return;
  }
  if(G.mode==='ai3' && G.battingTeam===1){
    showBig('공수 교대', '상대 팀 공격 · 자동 진행', '#ffcc66', 1500);
    setTimeout(function(){ if(G.token===tok) simAiHalf(); }, 1450);
  }else{
    showBig('공수 교대', (G.battingTeam===0?'청팀':'홍팀')+' 공격', '#ffcc66', 1250);
    setTimeout(function(){ if(G.token===tok) nextBatter(); }, 1200);
  }
}

async function simAiHalf(){
  var tok = G.token;
  G.phase='sim';
  setPitchUI(false);
  setSwingEnabled(false);
  updateBoard();
  while(G.outs<3 && G.token===tok){
    await sleep(720);
    if(G.token!==tok) return;
    var r = Math.random(), kindTxt='';
    if(r<0.58){ G.outs++; kindTxt='아웃'; }
    else if(r<0.81){ applyHit('1B',30); kindTxt='안타'; }
    else if(r<0.89){ applyHit('2B',70); kindTxt='2루타'; }
    else if(r<0.91){ applyHit('3B',85); kindTxt='3루타'; }
    else { applyHit('HR',110); kindTxt='홈런!'; }
    showLog('상대 '+kindTxt);
    updateBoard();
  }
  if(G.token!==tok) return;
  await sleep(700);
  if(G.token!==tok) return;
  endHalfInning();
}

function fireworks(){
  var cols = ['255,215,120','255,150,190','140,220,255','170,255,190','255,255,230'];
  for(var i=0;i<7;i++){
    (function(k){
      setTimeout(function(){
        if(G.scene!=='play') return;
        burst(rnd(0.12,0.88)*W, rnd(0.10,0.42)*H, pick(cols), 26);
        A.pop(0);
      }, k*170);
    })(i);
  }
}

/* ============================================================
   9. 시작 / 종료
   ============================================================ */
function clearTimers(){ G.token++; }

function showScreen(id){
  ['scrTitle','scrSetup','scrResult'].forEach(function(s){
    $(s).classList.toggle('hidden', s!==id);
  });
}
function hideScreens(){
  ['scrTitle','scrSetup','scrResult'].forEach(function(s){ $(s).classList.add('hidden'); });
}

function goTitle(){
  clearTimers();
  G.scene='title'; G.phase='idle'; P.active=false; FLY.on=false; PARTS.length=0;
  $('app').classList.remove('p2','derby');
  setPitchUI(false);
  setSwingEnabled(false);
  refreshTitleBest();
  showScreen('scrTitle');
  $('aiLog').innerHTML='';
  updateBoard();
}

function refreshTitleBest(){
  var best = LS.get('bs_derby', {hr:0, dist:0});
  $('titleBest').innerHTML = '홈런 <b>'+best.hr+'</b>개 · 최장 <b>'+Math.round(best.dist||0)+'</b>m';
}

function openSetup(mode){
  G.setupMode = mode;
  var cards = $('setupCards');
  cards.innerHTML = '';
  var list;
  if(mode==='solo'){
    $('setupKicker').textContent = 'SOLO · vs AI';
    $('setupTitle').textContent = '1인 모드';
    list = [
      { k:'derby', t:'⚾ 홈런 더비 · 10구', d:'AI 투수가 던지는 10개의 공. 홈런 개수와 최장 비거리에 도전!', pri:true },
      { k:'ai3', t:'🏟 3이닝 미니 경기', d:'AI 투수와 3이닝 승부. 내가 공격할 때만 타격, 상대 공격은 자동 진행.' }
    ];
  }else{
    $('setupKicker').textContent = 'VERSUS · 2P';
    $('setupTitle').textContent = '2인 대전';
    list = [
      { k:'2p1', t:'⚡ 1이닝 승부', d:'빠르게 한 판. 3아웃마다 공수 교대.' },
      { k:'2p3', t:'🔥 3이닝 승부', d:'제대로 한 판. 3이닝 동안 점수를 겨뤄요.', pri:true }
    ];
  }
  list.forEach(function(it){
    var b = document.createElement('button');
    b.className = 'bigBtn' + (it.pri?' primary':'');
    b.innerHTML = '<span>'+it.t+'</span><small>'+it.d+'</small>';
    b.addEventListener('click', function(){
      A.ui();
      if(it.k==='derby') startGame('derby', 0);
      else if(it.k==='ai3') startGame('ai3', 3);
      else if(it.k==='2p1') startGame('2p', 1);
      else startGame('2p', 3);
    });
    cards.appendChild(b);
  });
  showScreen('scrSetup');
}

function startGame(mode, innings){
  clearTimers();
  G.mode = mode;
  G.innings = Math.max(1, innings||3);
  G.inning = 1; G.half = 0; G.battingTeam = 0;
  G.outs=0; G.balls=0; G.strikes=0;
  G.score = [0,0];
  G.bases = [false,false,false];
  G.derby = { n:0, total:10, hr:0, hits:0, bestDist:0, sumDist:0, list:[] };
  G.scene = 'play'; G.phase='pre';
  P.active=false; FLY.on=false; PARTS.length=0; SWING.on=false;
  $('aiLog').innerHTML='';
  $('app').classList.toggle('p2', mode==='2p');
  $('app').classList.toggle('derby', mode==='derby');
  $('pitchPanel').classList.toggle('hidden', mode!=='2p');
  hideScreens();
  updateBoard();
  if(mode==='2p'){
    showBig('플레이 볼!', '위: 투수 · 아래: 타자', '#7dfba1', 1400);
  }else if(mode==='derby'){
    showBig('홈런 더비', '10구의 승부, 시작!', '#7dfba1', 1500);
  }else{
    showBig('플레이 볼!', '3이닝 미니 경기', '#7dfba1', 1500);
  }
  var tok = G.token;
  setTimeout(function(){ if(G.token===tok) nextBatter(); }, 900);
}

function endGame(){
  clearTimers();
  G.scene='result'; G.phase='idle';
  P.active=false;
  var title='', sub='', stats=[], kicker='GAME SET';
  if(G.mode==='derby'){
    var hr = G.derby.hr, best = Math.round(G.derby.bestDist);
    var prev = LS.get('bs_derby', {hr:0, dist:0});
    var newHr = hr > (prev.hr||0);
    var newDist = best > (prev.dist||0);
    if(newHr||newDist){
      LS.set('bs_derby', { hr: Math.max(hr, prev.hr||0), dist: Math.max(best, prev.dist||0) });
    }
    kicker = 'DERBY RESULT';
    title = hr>=5 ? '홈런왕!' : (hr>=2 ? '좋았어요!' : '한 번 더!');
    sub = '10구 중 홈런 '+hr+'개 · 안타 포함 '+G.derby.hits+'개';
    stats = [
      ['홈런', hr+'개' + (newHr?' 🎉 신기록':'')],
      ['최장 비거리', best+'m' + (newDist?' 🎉 신기록':'')],
      ['평균 비거리', (G.derby.hits? Math.round(G.derby.sumDist/Math.max(1,G.derby.hits)) : 0)+'m'],
      ['내 최고 기록', (LS.get('bs_derby',{hr:0,dist:0}).hr||0)+'개 · '+Math.round(LS.get('bs_derby',{hr:0,dist:0}).dist||0)+'m']
    ];
    refreshTitleBest();
  }else{
    var a = G.score[0], b2 = G.score[1];
    var who = G.mode==='ai3' ? ['청팀', 'AI'] : ['청팀', '홍팀'];
    kicker = 'FINAL SCORE';
    if(a>b2) title = (G.mode==='ai3' ? '승리! 🎉' : who[0]+' 승리!');
    else if(b2>a) title = (G.mode==='ai3' ? '패배…' : who[1]+' 승리!');
    else title = '무승부';
    sub = who[0]+' '+a+' : '+b2+' '+who[1];
    stats = [
      ['점수', a+' : '+b2],
      ['이닝', G.innings+'이닝'],
      ['청팀 안타', '-'],
      ['결과', a>b2?'승리':(a<b2?'패배':'무승부')]
    ];
    stats[2] = ['경기 방식', G.mode==='ai3'?'1인 vs AI':'2인 대전'];
  }
  showScreen('scrResult');
  $('resKicker').textContent = kicker;
  $('resTitle').textContent = title;
  $('resSub').textContent = sub;
  var box = $('resStats');
  box.innerHTML = '';
  stats.forEach(function(row){
    var d = document.createElement('div');
    d.className='resRow';
    d.innerHTML = '<span>'+row[0]+'</span><b>'+row[1]+'</b>';
    box.appendChild(d);
  });
  A.cheer();
  updateBoard();
}

/* ============================================================
   10. 입력/이벤트
   ============================================================ */
function syncChips(){
  var tp = $('typeChips'), cs = $('courseChips');
  Array.prototype.forEach.call(tp.querySelectorAll('.chip'), function(ch){
    ch.classList.toggle('on', ch.getAttribute('data-type')===G.sel.type);
  });
  Array.prototype.forEach.call(cs.querySelectorAll('.chip'), function(ch){
    ch.classList.toggle('on', ch.getAttribute('data-course')===G.sel.course);
  });
}

function unlockAudio(){
  A.init();
  A.resume();
}

document.addEventListener('pointerdown', function(){ unlockAudio(); }, { passive:true });

$('typeChips').addEventListener('click', function(e){
  var t = e.target.closest('.chip'); if(!t) return;
  if($('pitchPanel').classList.contains('locked')) return;
  G.sel.type = t.getAttribute('data-type');
  syncChips(); A.ui();
});
$('courseChips').addEventListener('click', function(e){
  var t = e.target.closest('.chip'); if(!t) return;
  if($('pitchPanel').classList.contains('locked')) return;
  G.sel.course = t.getAttribute('data-course');
  syncChips(); A.ui();
});
$('btnThrow').addEventListener('click', function(){
  if($('pitchPanel').classList.contains('locked')) return;
  if(G.phase!=='pre') return;
  A.ui();
  doPitch({ type:G.sel.type, course:G.sel.course });
});

$('btnSwing').addEventListener('pointerdown', function(e){
  e.preventDefault();
  onSwing();
});
/* 키보드(데스크톱 테스트) */
document.addEventListener('keydown', function(e){
  if(e.code==='Space'){ e.preventDefault(); onSwing(); }
});

$('btnMute').addEventListener('click', function(){
  muted = !muted;
  LS.set('bs_mute', muted);
  A.setMuted(muted);
  $('btnMute').textContent = muted ? '🔇' : '🔊';
  if(!muted) A.ui();
});
$('btnHome').addEventListener('click', function(){
  if(G.scene==='play'){
    if(!confirm('경기를 그만두고 처음으로 돌아갈까요?')) return;
  }
  A.ui(); goTitle();
});
$('btnSolo').addEventListener('click', function(){ A.ui(); openSetup('solo'); });
$('btnDuo').addEventListener('click', function(){ A.ui(); openSetup('2p'); });
$('btnBackSetup').addEventListener('click', function(){ A.ui(); goTitle(); });
$('btnAgain').addEventListener('click', function(){
  A.ui();
  if(G.mode==='2p') startGame('2p', G.innings);
  else if(G.mode==='ai3') startGame('ai3', 3);
  else startGame('derby', 0);
});
$('btnToTitle').addEventListener('click', function(){ A.ui(); goTitle(); });

/* ============================================================
   11. 메인 루프
   ============================================================ */
var lastT = 0;
function loop(ts){
  var t = ts/1000;
  var dt = lastT ? Math.min(0.05, t-lastT) : 0.016;
  lastT = t;
  render(dt);
  requestAnimationFrame(loop);
}

function boot(){
  $('btnMute').textContent = muted ? '🔇' : '🔊';
  resize();
  window.addEventListener('resize', function(){ resize(); });
  window.addEventListener('orientationchange', function(){ setTimeout(resize, 220); });
  refreshTitleBest();
  updateBoard();
  setSwingEnabled(false);
  setPitchUI(false);
  requestAnimationFrame(loop);
  window.__G = G;
  window.__P = P;
  window.__startGame = startGame;
}

if(document.readyState==='loading') document.addEventListener('DOMContentLoaded', boot);
else boot();

})();
